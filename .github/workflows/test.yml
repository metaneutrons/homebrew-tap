name: Qualify formulas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Formula/*.rb'
      - '.github/workflows/test.yml'
      - 'scripts/generate-readme.sh'
      - 'README.md'
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to qualify; blank selects every formula
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: formula-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover changed formulas
    runs-on: ubuntu-24.04
    outputs:
      formulas: ${{ steps.formulas.outputs.formulas }}
      linux_matrix: ${{ steps.formulas.outputs.linux_matrix }}
      macos_matrix: ${{ steps.formulas.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test qualification matrix policy
        run: |
          scripts/test-qualification-matrix.sh
          scripts/test-linux-matrix.sh
          bash scripts/test-prepare-aros-tools-openssl.sh
      - name: Resolve the closed formula set
        id: formulas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$DISPATCH_FORMULA" ]]; then
              if [[ ! "$DISPATCH_FORMULA" =~ ^[a-z0-9][a-z0-9@+._-]*$ ]]; then
                echo "::error::invalid formula name"
                exit 1
              fi
              changed="Formula/${DISPATCH_FORMULA}.rb"
              if [[ ! -f "$changed" ]]; then
                echo "::error::formula does not exist: $DISPATCH_FORMULA"
                exit 1
              fi
            else
              changed=$(find Formula -maxdepth 1 -type f -name '*.rb' -print | sort)
            fi
          else
            base=$EVENT_BEFORE
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base=$PR_BASE_SHA
            elif [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base=$(git rev-list --max-parents=0 HEAD)
            fi
            changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'Formula/*.rb')
          fi
          formulas=$(printf '%s\n' "$changed" | sed -n 's#^Formula/\(.*\)\.rb$#\1#p' | sort -u)
          formulas_json=$(printf '%s\n' "$formulas" | jq -Rsc \
            'split("\n") | map(select(length > 0))')
          macos_matrix=$(scripts/plan-qualification-matrix.sh "$formulas_json")
          linux_matrix=$(scripts/plan-linux-matrix.sh "$formulas_json")
          {
            echo "formulas=$formulas_json"
            echo "linux_matrix=$linux_matrix"
            echo "macos_matrix=$macos_matrix"
          } >> "$GITHUB_OUTPUT"
          printf 'Changed formulas: %s\n' "$formulas_json"

  macos:
    name: ${{ matrix.formula }} on ${{ matrix.runner }}
    if: needs.discover.outputs.formulas != '[]'
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        with:
          core: false
          cask: false
      - name: Audit, install and test
        env:
          FORMULA: ${{ matrix.formula }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          if [[ "$FORMULA" == aros-tools ]]; then
            bash scripts/prepare-aros-tools-openssl.sh
          fi
          if [[ "$FORMULA" == ami-rust ]]; then
            # The signed SDK formula pins its version explicitly. Its publisher
            # checks that version; redundant spelling is not an install defect.
            brew audit --strict --except=version "metaneutrons/tap/$FORMULA"
          else
            brew audit --strict "metaneutrons/tap/$FORMULA"
          fi
          brew install "metaneutrons/tap/$FORMULA"
          brew test "metaneutrons/tap/$FORMULA"
      - name: Remove qualification install
        if: always()
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew uninstall "$FORMULA" >/dev/null 2>&1 || true

  linux:
    name: ${{ matrix.formula }} on ${{ matrix.runner }}
    if: needs.discover.outputs.linux_matrix != '[]'
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        with:
          core: false
          cask: false
      - name: Audit, install and test
        env:
          FORMULA: ${{ matrix.formula }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew audit --strict "metaneutrons/tap/$FORMULA"
          brew install "metaneutrons/tap/$FORMULA"
          brew test "metaneutrons/tap/$FORMULA"
      - name: Remove qualification install
        if: always()
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew uninstall "$FORMULA" >/dev/null 2>&1 || true

  readme:
    name: README matches formulas
    needs: discover
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify deterministic formula documentation
        shell: bash
        run: |
          set -euo pipefail
          expected=$(mktemp)
          trap 'rm -f "$expected"' EXIT
          scripts/generate-readme.sh "$expected"
          if ! diff -u README.md "$expected"; then
            echo "::error::README.md is stale; run scripts/generate-readme.sh"
            exit 1
          fi

  gate:
    name: Formula qualification
    if: always()
    needs: [discover, macos, linux, readme]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce every applicable lane
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          README_RESULT: ${{ needs.readme.result }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != success ]]; then
            echo "::error::formula discovery ended with $DISCOVER_RESULT"
            exit 1
          fi
          if [[ "$README_RESULT" != success ]]; then
            echo "::error::README verification ended with $README_RESULT"
            exit 1
          fi
          for result in "$MACOS_RESULT" "$LINUX_RESULT"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::formula qualification lane ended with $result"
              exit 1
            fi
          done
