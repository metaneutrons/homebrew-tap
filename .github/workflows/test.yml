name: Qualify formulas

on:
  pull_request:
    branches: [main]
    paths:
      - 'Formula/*.rb'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'Formula/*.rb'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to qualify; blank selects every formula
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: formula-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover changed formulas
    runs-on: ubuntu-24.04
    outputs:
      formulas: ${{ steps.formulas.outputs.formulas }}
      aros_tools: ${{ steps.formulas.outputs.aros_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve the closed formula set
        id: formulas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$DISPATCH_FORMULA" ]]; then
              if [[ ! "$DISPATCH_FORMULA" =~ ^[a-z0-9][a-z0-9@+._-]*$ ]]; then
                echo "::error::invalid formula name"
                exit 1
              fi
              changed="Formula/${DISPATCH_FORMULA}.rb"
              if [[ ! -f "$changed" ]]; then
                echo "::error::formula does not exist: $DISPATCH_FORMULA"
                exit 1
              fi
            else
              changed=$(find Formula -maxdepth 1 -type f -name '*.rb' -print | sort)
            fi
          else
            base=$EVENT_BEFORE
            if [[ "$EVENT_NAME" == pull_request ]]; then
              base=$PR_BASE_SHA
            elif [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base=$(git rev-list --max-parents=0 HEAD)
            fi
            changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'Formula/*.rb')
          fi
          formulas=$(printf '%s\n' "$changed" | sed -n 's#^Formula/\(.*\)\.rb$#\1#p' | sort -u)
          formulas_json=$(printf '%s\n' "$formulas" | jq -Rsc \
            'split("\n") | map(select(length > 0))')
          aros_tools=false
          if printf '%s\n' "$formulas" | grep -Fxq aros-tools; then
            aros_tools=true
          fi
          {
            echo "formulas=$formulas_json"
            echo "aros_tools=$aros_tools"
          } >> "$GITHUB_OUTPUT"
          printf 'Changed formulas: %s\n' "$formulas_json"

  macos:
    name: ${{ matrix.formula }} on ${{ matrix.runner }}
    if: needs.discover.outputs.formulas != '[]'
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.discover.outputs.formulas) }}
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        with:
          core: false
          cask: false
      - name: Audit, install and test
        env:
          FORMULA: ${{ matrix.formula }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew audit --strict "metaneutrons/tap/$FORMULA"
          brew install "metaneutrons/tap/$FORMULA"
          brew test "metaneutrons/tap/$FORMULA"
      - name: Remove qualification install
        if: always()
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew uninstall "$FORMULA" >/dev/null 2>&1 || true

  aros-tools-linux:
    name: aros-tools on ${{ matrix.runner }}
    if: needs.discover.outputs.aros_tools == 'true'
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        with:
          core: false
          cask: false
      - name: Audit, install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew audit --strict metaneutrons/tap/aros-tools
          brew install metaneutrons/tap/aros-tools
          brew test metaneutrons/tap/aros-tools
      - name: Remove qualification install
        if: always()
        run: brew uninstall aros-tools >/dev/null 2>&1 || true

  gate:
    name: Formula qualification
    if: always()
    needs: [discover, macos, aros-tools-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce every applicable lane
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.aros-tools-linux.result }}
        run: |
          set -euo pipefail
          if [[ "$DISCOVER_RESULT" != success ]]; then
            echo "::error::formula discovery ended with $DISCOVER_RESULT"
            exit 1
          fi
          for result in "$MACOS_RESULT" "$LINUX_RESULT"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::formula qualification lane ended with $result"
              exit 1
            fi
          done
